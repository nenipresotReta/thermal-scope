name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/plot-scale.test.js
      - run: node tests/recording.test.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t thermal-scope:test .
      - name: Fresh-container onboarding
        run: |
          docker run -d --name scope -p 127.0.0.1:8080:8080 thermal-scope:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/api/device > /tmp/device.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("/tmp/device.json")); assert d["host"] == "" and not d["connected"]'
          docker stop scope
