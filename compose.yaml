services:
  thermal-scope:
    build: .
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      DEVICE_HOST: "${DEVICE_HOST:-}"
      POLL_INTERVAL: "${POLL_INTERVAL:-0.1}"
    volumes:
      - scope-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
volumes:
  scope-data:
